<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Queue Fair</title>
  <meta name="description" content="Shuffle only the songs from people who are actually there.">
  <meta property="og:title" content="Queue Fair">
  <meta property="og:description" content="Fair group queue shuffling for Spotify.">
  <meta property="og:image" content="https://qfair.github.io/favicon.png">
  <meta property="og:url" content="https://qfair.github.io">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" sizes="192x192" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="wave-bg" aria-hidden="true">
  <div class="wv wv1"></div>
  <div class="wv wv2"></div>
  <div class="wv wv3"></div>
  <div class="wv wv4"></div>
</div>
<div class="container">
  <!-- STEP 1: Connect -->
  <div class="step active" id="step-setup">
    <h1>Queue<br><span>Fair</span></h1>
    <p class="subtitle">// shuffle only the songs from people who are actually there</p>
    <button class="btn btn-full" onclick="doAuth()">Connect to Spotify</button>
    <div id="status" class="status"></div>
  </div>

  <!-- STEP 2: Pick playlist -->
  <div class="step" id="step-playlists">
    <div class="card">
      <div class="card-label">Your Playlists (tap one to select)</div>
      <div id="playlist-grid" class="playlist-grid">
        <div class="loading">Loading your playlists…</div>
      </div>
    </div>
  </div>

  <!-- STEP 3: Who's here -->
  <div class="step" id="step-members">
    <button class="back-btn" onclick="goBack('step-playlists')">← pick a different playlist</button>
    <div id="selected-playlist-display"></div>
    <div class="card">
      <div class="card-label">Who's here right now?</div>
      <div class="members-grid" id="members-grid">
        <div class="loading">Loading…</div>
      </div>
      <div class="select-row">
        <button class="select-link" onclick="selectAll(true)">select all</button>
        <span style="color:var(--border)">|</span>
        <button class="select-link" onclick="selectAll(false)">clear</button>
      </div>
      <div id="status2" class="status"></div>
    </div>
    <div class="toggle-row">
      <label class="equal-toggle">
        <input type="checkbox" id="equalSelection" checked onchange="toggleEqualMode(this.checked)">
        <span class="equal-toggle-box"></span>
        <span class="equal-toggle-label">Equal Selection</span>
      </label>
    </div>
    <div class="equal-mode-row" id="equal-mode-row">
      <div class="mode-option">
        <button class="mode-chip active" id="mode-time" onclick="setEqualMode('time')">Listening Time</button>
        <span class="info-icon" data-tooltip="Everyone gets the same total listening time. Best when tracks vary a lot in length.">i</span>
      </div>
      <div class="mode-option">
        <button class="mode-chip" id="mode-songs" onclick="setEqualMode('songs')">Song Count</button>
        <span class="info-icon" data-tooltip="Everyone gets the same number of songs in the queue, regardless of how long they are.">i</span>
      </div>
    </div>
<button class="btn btn-full" onclick="buildQueue()">Build Shuffled Queue</button>
  </div>

  <!-- STEP 4: Queue + play -->
  <div class="step" id="step-queue">
    <button class="back-btn" onclick="backFromQueue()">← change who's here</button>
    <div class="card">
      <div class="stats-row">
        <div>
          <div class="track-count" id="q-count">0</div>
          <div class="track-count-label">tracks queued</div>
        </div>
        <div>
          <div class="track-count" id="q-members" style="font-size:1.6rem">0</div>
          <div class="track-count-label">members included</div>
        </div>
      </div>
      <hr class="divider">
      <div class="track-list" id="track-list"></div>
    </div>
    <button class="btn btn-full btn-play" id="play-btn" onclick="startPlayback()"><span id="play-btn-text">Play on Spotify Now</span></button>
    <button class="btn btn-reroll" id="reroll-btn" onclick="buildQueue()"><span class="reroll-icon">↺</span> Re-roll Queue</button>
    <div id="status3" class="status" style="margin-top:0.8rem;"></div>
  </div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
